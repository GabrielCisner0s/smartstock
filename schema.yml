  /api/products/low-stock/:
    get:
      operationId: products_low_stock_list
      description: Returns active products whose stock is at or below their configured
        minimum stock level.
      summary: List low-stock products
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Products
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
        '401':
          description: Authentication required.
        '403':
          description: User does not have permission.
  /api/reports/dashboard/:
    get:
      operationId: reports_dashboard_retrieve
      description: Returns a general overview of the system, including relevant inventory
        and product metrics.
      summary: Get system dashboard
      tags:
      - Reports
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
        '401':
          description: Authentication required.
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
      required:
      - name
    Dashboard:
      type: object
      properties:
        total_products:
          type: integer
        active_products:
          type: integer
        low_stock_products:
          type: integer
        entries_today:
          type: integer
        exits_today:
          type: integer
      required:
      - active_products
      - entries_today
      - exits_today
      - low_stock_products
      - total_products
    InventoryDashboard:
      type: object
      properties:
        entries:
          type: integer
        exits:
          type: integer
        adjustments:
          type: integer
      required:
      - adjustments
      - entries
      - exits
    InventorySummary:
      type: object
      properties:
        total_products:
          type: integer
        total_stock:
          type: integer
        low_stock:
          type: integer
        out_of_stock:
          type: integer
      required:
      - low_stock
      - out_of_stock
      - total_products
      - total_stock
    MovementTypeEnum:
      enum:
      - ENTRY
      - EXIT
      - ADJUSTMENT
      type: string
      description: |-
        * `ENTRY` - Entrada
        * `EXIT` - Salida
        * `ADJUSTMENT` - Ajuste
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PaginatedStockMovementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
    PatchedProductRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        category_id:
          type: integer
          writeOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        minimum_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusEnum'
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sku:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
        description:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        minimum_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - id
      - name
      - price
      - sku
      - updated_at
    ProductRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        category_id:
          type: integer
          writeOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        minimum_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - category_id
      - name
      - price
      - sku
    ProductSimple:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sku:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
      required:
      - id
      - name
      - sku
    ProductSimpleRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
      - sku
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - last_name
      - phone
      - role
      - username
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
      required:
      - email
      - username
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
      - username
    RoleEnum:
      enum:
      - ADMIN
      - SUPERVISOR
      - EMPLOYEE
      type: string
      description: |-
        * `ADMIN` - Administrador
        * `SUPERVISOR` - Supervisor
        * `EMPLOYEE` - Empleado
    StatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      type: string
      description: |-
        * `ACTIVE` - Activo
        * `INACTIVE` - Inactivo
    StockMovement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/ProductSimple'
          readOnly: true
        movement_type:
          $ref: '#/components/schemas/MovementTypeEnum'
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        reason:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserSimple'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - movement_type
      - product
      - quantity
    StockMovementRequest:
      type: object
      properties:
        product_id:
          type: integer
          writeOnly: true
        movement_type:
          $ref: '#/components/schemas/MovementTypeEnum'
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        reason:
          type: string
      required:
      - movement_type
      - product_id
      - quantity
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserSimple:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - id
      - username
    UserSimpleRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - username
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
